name: onegate_intercom
description: Plug-and-play Neighbours/Intercom module (rooms, chat, and Jitsi calls) for OneGate-compatible Flutter apps.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_i18n: ^0.37.1
  onegate_feature_core:
    path: ../onegate_feature_core
  dio: ^5.7.0
  jwt_decoder: ^2.0.1
  web_socket_channel: ">=2.4.0 <4.0.0"
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  jitsi_meet_flutter_sdk: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
