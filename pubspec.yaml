name: neigbours_intercom_service
description: Reusable Neighbours + Guard Intercom Flutter package (UI + services) with injectable auth, context, and endpoints.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.4.0
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.2
  jwt_decoder: ^2.0.1
  intl: ^0.20.2
  dio: ^5.7.0
  equatable: ^2.0.5
  uuid: ^4.5.1

  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^5.0.2
  flutter_image_compress: ^2.3.0
  share_plus: ^12.0.0
  record: ^5.0.4
  just_audio: ^0.9.36
  jitsi_meet_flutter_sdk: ^10.3.0
  geolocator: ^14.0.2
  flutter_contacts: ^1.1.9+2
  url_launcher: ^6.3.1
  speech_to_text: ^6.6.0
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
