apiVersion: 1

datasources:
  # Prometheus
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Loki for Logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # Tempo for Tracing
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true

  # ClickHouse for SigNoz
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    editable: true
    jsonData:
      defaultDatabase: signoz_traces
      username: default
      tlsSkipVerify: true

  # PostgreSQL
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: observatory
    user: postgres
    secureJsonData:
      password: password
    editable: true

  # Redis (if plugin available)
  - name: Redis
    type: redis-datasource
    access: proxy
    url: redis:6379
    editable: true

  # Elasticsearch
  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "[logstash-]YYYY.MM.DD"
    interval: Daily
    timeField: "@timestamp"
    editable: true

  # SigNoz Query Service
  - name: SigNoz
    type: prometheus
    access: proxy
    url: http://signoz-query-service:8080
    editable: true

  # OneGate Observatory API
  - name: Observatory API
    type: grafana-simple-json-datasource
    access: proxy
    url: http://observatory-dashboard:5015/api/grafana
    editable: true

  # Consolidated Dashboard API
  - name: Consolidated API
    type: grafana-simple-json-datasource
    access: proxy
    url: http://consolidated-dashboard:3002/api/grafana
    editable: true
