version: '3.8'

services:
  # SigNoz APM (Application Performance Monitoring)
  signoz-frontend:
    image: signoz/frontend:0.39.0
    container_name: onegate-signoz-frontend
    ports:
      - "3301:3301"
    environment:
      - FRONTEND_API_ENDPOINT=http://signoz-query-service:8080
    depends_on:
      - signoz-query-service
    networks:
      - observatory-network

  signoz-query-service:
    image: signoz/query-service:0.39.0
    container_name: onegate-signoz-query-service
    ports:
      - "8080:8080"
    environment:
      - ClickHouseUrl=tcp://clickhouse:9000
      - STORAGE=clickhouse
      - GODEBUG=netdns=go
      - TELEMETRY_ENABLED=true
      - DEPLOYMENT_TYPE=docker-standalone-amd
    depends_on:
      - clickhouse
    networks:
      - observatory-network

  signoz-otel-collector:
    image: signoz/signoz-otel-collector:0.88.11
    container_name: onegate-signoz-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
      - "9411:9411"
      - "13133:13133"
      - "14250:14250"
      - "14268:14268"
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=service.name=onegate-flutter,service.version=1.0.0
    depends_on:
      - clickhouse
    networks:
      - observatory-network

  # ClickHouse for SigNoz
  clickhouse:
    image: clickhouse/clickhouse-server:23.7
    container_name: onegate-clickhouse
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse/
    environment:
      - CLICKHOUSE_DB=signoz_traces
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
    networks:
      - observatory-network

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: onegate-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - observatory-network

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: onegate-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    networks:
      - observatory-network

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: onegate-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=observatory
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - observatory-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: onegate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - observatory-network

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  prometheus-data:
  clickhouse-data:

networks:
  observatory-network:
    driver: bridge
