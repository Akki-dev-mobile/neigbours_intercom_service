arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/generated/l10n
nullable-getter: false
untranslated-messages-file: untranslated_messages.json
header: |
  // GENERATED CODE - DO NOT MODIFY BY HAND
  // This file is generated by the Flutter localization tool.
  // ignore_for_file: prefer_single_quotes, lines_longer_than_80_chars
  // ignore_for_file: unnecessary_brace_in_string_interps, unnecessary_new
  // ignore_for_file: prefer_single_quotes, comment_references, prefer_generic_function_type_aliases
  // ignore_for_file: unnecessary_import, unused_import, implicit_dynamic_list_literal
  // ignore_for_file: unnecessary_brace_in_string_interps, unnecessary_lambdas
  // ignore_for_file: unnecessary_string_interpolations, lines_longer_than_80_chars
  // ignore_for_file: avoid_escaping_inner_quotes
preferred-supported-locales: ["en", "hi", "mr"] 