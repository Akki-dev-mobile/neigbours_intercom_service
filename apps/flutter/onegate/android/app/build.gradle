plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

/*
def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}
*/

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

/*
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
*/

android {
    namespace "com.cubeonebiz.gate.flutter_onegate"
    compileSdk 36
    // Use Flutter's default NDK so the build works without installing a specific NDK version
    ndkVersion flutter.ndkVersion


//    externalNativeBuild {
//        cmake {
//            version "3.31.5"  // Match the required version from your error
//            path "CMakeLists.txt"  // Path to your CMake file if using native code
//        }
//    }

    defaultConfig {
        applicationId "com.cubeonebiz.gate.flutter_onegate"
        minSdkVersion 26  // jitsi-meet-sdk requires 26+
        //noinspection OldTargetApi
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        manifestPlaceholders = [
                appAuthRedirectScheme: 'com.cubeonebiz.gate',
                applicationName      : 'android.app.Application' // Use standard Android Application class
        ]
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                keyAlias keystoreProperties['alias_name']
                keyPassword keystoreProperties['keyPassword']
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Temporarily use debug signing for release builds
            signingConfig signingConfigs.debug

            shrinkResources = true
            minifyEnabled true
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }


    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

configurations.configureEach {
    exclude group: "androidx.media3", module: "media3-exoplayer-rtsp"
}
